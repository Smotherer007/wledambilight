version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      # small, compatible updates come as one PR ...
      cargo-patch:
        update-types: ["patch"]
    # ... everything else (e.g. egui 0.32 -> 0.37, which breaks the API) gets
    # its own PR, so a red CI points straight at the crate that needs work
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
