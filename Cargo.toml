[package]
name = "ambilight"
version = "0.1.0"
edition = "2021"

[dependencies]
ashpd = { version = "0.13", features = ["screencast"] }
libc = "0.2"
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
eframe = "0.32"
egui = "0.32"
serde = "1.0.229"
serde_json = "1.0.154"
ureq = "3.4.2"
ksni = { version = "0.3.6", features = ["blocking"] }
