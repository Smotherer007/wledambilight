<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>WLED Ambilight</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272B36"/>
      <stop offset="1" stop-color="#14161C"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D212B"/>
      <stop offset="1" stop-color="#0D0F14"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="wide" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="near" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="tileclip">
      <rect x="16" y="16" width="480" height="480" rx="108"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>

  <!-- light thrown onto the wall: one colour per screen edge -->
  <g clip-path="url(#tileclip)">
    <g filter="url(#wide)" opacity="0.85">
      <rect x="110" y="120" width="292" height="60" rx="30" fill="#FFC46B"/>
      <rect x="370" y="150" width="60" height="212" rx="30" fill="#FF4F8B"/>
      <rect x="110" y="332" width="292" height="60" rx="30" fill="#2FD5E6"/>
      <rect x="82" y="150" width="60" height="212" rx="30" fill="#8A63FF"/>
    </g>
    <g filter="url(#near)">
      <rect x="140" y="150" width="232" height="26" rx="13" fill="#FFD48F"/>
      <rect x="378" y="186" width="26" height="140" rx="13" fill="#FF6E9F"/>
      <rect x="140" y="336" width="232" height="26" rx="13" fill="#5BE3F0"/>
      <rect x="108" y="186" width="26" height="140" rx="13" fill="#A184FF"/>
    </g>
  </g>

  <!-- the monitor -->
  <rect x="122" y="168" width="268" height="176" rx="20" fill="url(#screen)" stroke="#3B4152" stroke-width="5"/>
  <rect x="122" y="168" width="268" height="176" rx="20" fill="url(#sheen)"/>
</svg>
